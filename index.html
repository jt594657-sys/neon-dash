<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Dash Ultra Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
        body {
            font-family: 'Orbitron', sans-serif;
            background-color: #030308;
            color: #ffffff;
            overflow: hidden;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, #0c0d24 0%, #030308 100%);
        }
        .glow-text {
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.8), 0 0 20px rgba(0, 243, 255, 0.5), 0 0 30px rgba(0, 243, 255, 0.3);
        }
        .glow-box {
            box-shadow: 0 0 25px rgba(255, 0, 128, 0.6), inset 0 0 15px rgba(255, 0, 128, 0.4);
        }
        .skin-btn {
            border: 2px solid transparent;
            transition: all 0.2s ease;
        }
        .skin-btn.active {
            border-color: #ffffff;
            transform: scale(1.1);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
        }
    </style>
</head>
<body class="relative w-screen h-screen">

    <!-- UI Overlay for Mobile & Desktop -->
    <div id="ui-layer" class="absolute inset-0 pointer-events-none flex flex-col justify-between p-4 md:p-6 z-10">
        <!-- Top HUD: Score & Progress Bar -->
        <div class="flex flex-col gap-2 w-full">
            <div class="flex justify-between items-center text-sm md:text-2xl font-bold tracking-widest">
                <div id="score-display" class="glow-text text-cyan-400">DIST: 0m</div>
                <div id="powerup-display" class="hidden text-yellow-300 font-extrabold animate-pulse text-xs sm:text-lg">⚡ DESTRUIÇÃO ATIVA!</div>
                <div class="flex gap-4 md:gap-6">
                    <div id="best-display" class="text-yellow-400">BEST: 0m</div>
                    <div id="attempts-display" class="text-pink-500">TRIES: 1</div>
                </div>
            </div>
            <!-- Progress Bar -->
            <div class="w-full bg-gray-900/80 rounded-full h-2.5 border border-cyan-500/30 overflow-hidden">
                <div id="progress-bar" class="bg-gradient-to-r from-cyan-400 via-pink-500 to-yellow-400 h-full w-0 transition-all duration-100"></div>
            </div>
            <!-- Power-up Duration Bar -->
            <div id="powerup-bar-container" class="hidden w-full bg-gray-900/80 rounded-full h-2 border border-yellow-500/50 overflow-hidden">
                <div id="powerup-bar" class="bg-yellow-400 h-full w-full transition-all duration-75"></div>
            </div>
        </div>

        <!-- Center Menu & Game Over Screen -->
        <div id="center-message" class="absolute inset-0 flex flex-col items-center justify-center pointer-events-auto bg-black/80 backdrop-blur-md transition-opacity duration-300 p-6 text-center">
            <h1 id="main-title" class="text-4xl sm:text-6xl md:text-8xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-pink-500 to-yellow-400 glow-text mb-3">NEON DASH ULTRA</h1>
            <p id="sub-message" class="text-sm sm:text-lg md:text-xl text-cyan-200 mb-6 tracking-wider max-w-md">
                Toque e segure para saltos contínuos. Chegue aos 2000m para VENCER!
            </p>

            <!-- Skin Selector -->
            <div id="skin-selector" class="mb-6 flex gap-4 justify-center items-center">
                <span class="text-xs text-gray-400 font-bold uppercase tracking-wider">SKIN:</span>
                <button class="skin-btn active w-8 h-8 rounded-lg bg-cyan-400" id="skin-cyan" data-color="#00f3ff"></button>
                <button class="skin-btn w-8 h-8 rounded-lg bg-pink-500" id="skin-pink" data-color="#ff007f"></button>
                <button class="skin-btn w-8 h-8 rounded-lg bg-green-400" id="skin-green" data-color="#00ff66"></button>
                <button class="skin-btn w-8 h-8 rounded-lg bg-yellow-500" id="skin-yellow" data-color="#ffaa00"></button>
            </div>

            <div class="flex flex-col gap-3 w-full max-w-xs">
                <button id="continue-btn" class="hidden w-full py-3.5 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-black text-lg rounded-2xl glow-box transition-all transform active:scale-95 cursor-pointer">
                    CONTINUAR PARTIDA
                </button>
                <button id="start-btn" class="w-full py-4 bg-gradient-to-r from-pink-600 to-purple-600 hover:from-pink-500 hover:to-purple-500 text-white font-black text-lg sm:text-xl rounded-2xl glow-box transition-all transform active:scale-95 cursor-pointer">
                    REINICIAR
                </button>
            </div>
        </div>

        <!-- Footer Help -->
        <div class="text-center text-[10px] md:text-xs text-gray-400 tracking-wider">
            SYNTH AUDIO ACTIVE • TOUCH / SPACEBAR TO JUMP
        </div>
    </div>

    <!-- Main Game Canvas -->
    <canvas id="gameCanvas"></canvas>

    <script>
        // Canvas & Context Setup
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // UI Elements
        const uiLayer = document.getElementById('ui-layer');
        const centerMessage = document.getElementById('center-message');
        const mainTitle = document.getElementById('main-title');
        const startBtn = document.getElementById('start-btn');
        const continueBtn = document.getElementById('continue-btn');
        const scoreDisplay = document.getElementById('score-display');
        const bestDisplay = document.getElementById('best-display');
        const attemptsDisplay = document.getElementById('attempts-display');
        const subMessage = document.getElementById('sub-message');
        const progressBar = document.getElementById('progress-bar');
        const powerupDisplay = document.getElementById('powerup-display');
        const powerupBarContainer = document.getElementById('powerup-bar-container');
        const powerupBar = document.getElementById('powerup-bar');

        // Responsive Resizing
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Web Audio API Synthesizer
        class SoundFX {
            constructor() {
                this.ctx = null;
                this.bgmTimer = null;
                this.step = 0;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playJump() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(150, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(600, this.ctx.currentTime + 0.15);
                
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.15);
            }

            playDeath() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 0.35);

                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.35);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.35);
            }

            playDestroy() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(800, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.2);

                gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.2);
            }

            playPowerup() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, this.ctx.currentTime + 0.3);

                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.3);
            }

            playVictory() {
                if (!this.ctx) return;
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    setTimeout(() => {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.4);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start();
                        osc.stop(this.ctx.currentTime + 0.4);
                    }, idx * 120);
                });
            }

            startBGM() {
                this.init();
                if (this.bgmTimer) clearInterval(this.bgmTimer);
                const notes = [110, 110, 220, 147, 110, 165, 220, 130];
                this.step = 0;
                this.bgmTimer = setInterval(() => {
                    if (currentState !== GAME_STATE.PLAYING || !this.ctx) return;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    let freq = notes[this.step % notes.length];
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);

                    gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.12);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.12);
                    this.step++;
                }, 140);
            }

            stopBGM() {
                if (this.bgmTimer) {
                    clearInterval(this.bgmTimer);
                    this.bgmTimer = null;
                }
            }
        }

        const audio = new SoundFX();

        // Game States & Variables
        const GAME_STATE = { MENU: 0, PLAYING: 1, GAMEOVER: 2, VICTORY: 3 };
        let currentState = GAME_STATE.MENU;

        let score = 0;
        let maxDistance = 2000;
        let finishLineX = -1;
        let bestScore = localStorage.getItem('neon_dash_best') || 0;
        let attempts = 1;
        let gameSpeed = 7.5;
        const baseSpeed = 7.5;
        let gravity = 0.70;
        let groundY = 0;
        let screenShake = 0;

        bestDisplay.innerText = `BEST: ${bestScore}m`;

        // Player Config & Skin Customization
        let playerSkinColor = localStorage.getItem('neon_dash_skin') || '#00f3ff';
        let player = {
            x: 120,
            y: 0,
            size: 38,
            vy: 0,
            jumpForce: -14.5,
            isGrounded: false,
            rotation: 0,
            color: playerSkinColor,
            trail: []
        };

        // System Variables for Power-up
        let isPowerActive = false;
        let powerTimer = 0;
        const POWER_DURATION = 300;

        function selectSkin(color) {
            playerSkinColor = color;
            player.color = color;
            localStorage.setItem('neon_dash_skin', color);
            document.querySelectorAll('.skin-btn').forEach(btn => btn.classList.remove('active'));
            if (color === '#00f3ff') document.getElementById('skin-cyan')?.classList.add('active');
            if (color === '#ff007f') document.getElementById('skin-pink')?.classList.add('active');
            if (color === '#00ff66') document.getElementById('skin-green')?.classList.add('active');
            if (color === '#ffaa00') document.getElementById('skin-yellow')?.classList.add('active');
        }
        window.selectSkin = selectSkin;

        document.querySelectorAll('.skin-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const color = btn.getAttribute('data-color');
                if (color) selectSkin(color);
            });
        });

        selectSkin(playerSkinColor);

        let isTouchHeld = false;
        let obstacles = [];
        let powerups = [];
        let particles = [];
        let shockwaves = [];
        let backgroundStars = [];
        let beatPulse = 0;

        function initStars() {
            backgroundStars = [];
            for (let i = 0; i < 70; i++) {
                backgroundStars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 2.2,
                    speed: Math.random() * 0.6 + 0.2,
                    alpha: Math.random() * 0.7 + 0.3
                });
            }
        }
        initStars();

        function generateLevel() {
            obstacles = [];
            powerups = [];
            let currentX = 700;
            finishLineX = -1;

            while (currentX < maxDistance * 8) {
                let spacing = Math.random() * 180 + 260;
                currentX += spacing;

                if (Math.random() < 0.15) {
                    powerups.push({
                        x: currentX - 100,
                        y: 110,
                        size: 26,
                        pulse: 0
                    });
                }

                let pattern = Math.random();

                if (pattern < 0.35) {
                    let count = Math.random() < 0.7 ? 1 : 2;
                    for (let s = 0; s < count; s++) {
                        obstacles.push({
                            type: 'spike',
                            x: currentX + (s * 34),
                            y: 0,
                            w: 34,
                            h: 36,
                            color: '#ff0055'
                        });
                    }
                    currentX += count * 34;
                } else if (pattern < 0.7) {
                    let blockH = Math.random() > 0.5 ? 65 : 95;
                    obstacles.push({
                        type: 'block',
                        x: currentX,
                        y: blockH,
                        w: 110,
                        h: blockH,
                        color: '#8b00ff'
                    });
                } else {
                    let blockH = 80;
                    obstacles.push({
                        type: 'block',
                        x: currentX,
                        y: blockH,
                        w: 130,
                        h: blockH,
                        color: '#7928ca'
                    });
                    obstacles.push({
                        type: 'spike',
                        x: currentX + 170,
                        y: 0,
                        w: 34,
                        h: 36,
                        color: '#ff0055'
                    });
                }
            }

            finishLineX = currentX + 400;
        }

        function spawnParticles(x, y, color, count = 20) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 14,
                    vy: (Math.random() - 0.5) * 14,
                    size: Math.random() * 6 + 2,
                    color: color,
                    alpha: 1,
                    decay: Math.random() * 0.03 + 0.015
                });
            }
        }

        function createShockwave(x, y, color) {
            shockwaves.push({
                x: x,
                y: y,
                radius: 5,
                maxRadius: 45,
                alpha: 1,
                color: color
            });
        }

        function startGame(resetScore = true) {
            audio.init();
            audio.startBGM();
            groundY = canvas.height - 100;
            player.y = groundY - player.size;
            player.vy = 0;
            player.rotation = 0;
            player.trail = [];

            isPowerActive = false;
            powerTimer = 0;
            powerupDisplay.classList.add('hidden');
            powerupBarContainer.classList.add('hidden');
            mainTitle.innerText = "NEON DASH ULTRA";
            mainTitle.className = "text-4xl sm:text-6xl md:text-8xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-pink-500 to-yellow-400 glow-text mb-3";
            
            if (resetScore) {
                score = 0;
                gameSpeed = baseSpeed;
                generateLevel();
            } else {
                obstacles = obstacles.filter(obs => obs.x > player.x + 300);
            }

            screenShake = 0;
            currentState = GAME_STATE.PLAYING;
            centerMessage.style.opacity = '0';
            setTimeout(() => {
                centerMessage.style.display = 'none';
            }, 300);
        }

        function continueGame() {
            startGame(false);
        }

        function triggerJump() {
            if (currentState === GAME_STATE.PLAYING && player.isGrounded) {
                player.vy = player.jumpForce;
                player.isGrounded = false;
                audio.playJump();
                spawnParticles(player.x + player.size / 2, groundY, player.color, 10);
                createShockwave(player.x + player.size / 2, groundY, player.color);
            } else if (currentState === GAME_STATE.MENU || currentState === GAME_STATE.GAMEOVER) {
                startGame();
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
                e.preventDefault();
                triggerJump();
            }
        });

        function handleTouchStart(e) {
            isTouchHeld = true;
            triggerJump();
            if (e.cancelable && e.target.tagName !== 'BUTTON') {
                e.preventDefault();
            }
        }

        function handleTouchEnd(e) {
            isTouchHeld = false;
        }

        window.addEventListener('touchstart', handleTouchStart, { passive: false });
        window.addEventListener('touchend', handleTouchEnd, { passive: false });
        window.addEventListener('touchcancel', handleTouchEnd, { passive: false });

        window.addEventListener('mousedown', (e) => {
            if (e.target === canvas || e.target === uiLayer) {
                triggerJump();
            }
        });

        startBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            startGame(true);
        });

        continueBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            continueGame();
        });

        function update() {
            if (currentState !== GAME_STATE.PLAYING) return;

            groundY = canvas.height - 100;

            gameSpeed = baseSpeed + Math.floor(score / 500) * 0.4;

            if (isTouchHeld && player.isGrounded) {
                triggerJump();
            }

            if (finishLineX > -100) {
                finishLineX -= gameSpeed;
            }

            if (finishLineX > 0 && player.x >= finishLineX - 20) {
                triggerVictory();
                return;
            }

            if (isPowerActive) {
                powerTimer--;
                let pct = (powerTimer / POWER_DURATION) * 100;
                powerupBar.style.width = `${pct}%`;

                if (powerTimer <= 0) {
                    isPowerActive = false;
                    powerupDisplay.classList.add('hidden');
                    powerupBarContainer.classList.add('hidden');
                }
            }

            player.vy += gravity;
            player.y += player.vy;

            if (!player.isGrounded) {
                player.rotation += 10;
            } else {
                let targetRot = Math.round(player.rotation / 90) * 90;
                player.rotation += (targetRot - player.rotation) * 0.4;
            }

            if (player.y + player.size >= groundY) {
                if (!player.isGrounded && player.vy > 5) {
                    createShockwave(player.x + player.size / 2, groundY, '#ffffff');
                }
                player.y = groundY - player.size;
                player.vy = 0;
                player.isGrounded = true;
                player.rotation = Math.round(player.rotation / 360) * 360;
            }

            if (Math.random() < 0.6) {
                player.trail.push({
                    x: player.x,
                    y: player.y,
                    size: player.size,
                    rotation: player.rotation,
                    alpha: 0.5
                });
            }
            for (let i = player.trail.length - 1; i >= 0; i--) {
                player.trail[i].alpha -= 0.07;
                if (player.trail[i].alpha <= 0) player.trail.splice(i, 1);
            }

            let pBox = { x: player.x, y: player.y, w: player.size, h: player.size };
            for (let i = powerups.length - 1; i >= 0; i--) {
                let pw = powerups[i];
                pw.x -= gameSpeed;
                pw.pulse += 0.1;

                let pwBox = { x: pw.x - pw.size/2, y: groundY - pw.y - pw.size/2, w: pw.size, h: pw.size };

                if (
                    pBox.x < pwBox.x + pwBox.w &&
                    pBox.x + pBox.w > pwBox.x &&
                    pBox.y < pwBox.y + pwBox.h &&
                    pBox.y + pBox.h > pwBox.y
                ) {
                    isPowerActive = true;
                    powerTimer = POWER_DURATION;
                    audio.playPowerup();
                    spawnParticles(pw.x, groundY - pw.y, '#ffe600', 30);
                    createShockwave(pw.x, groundY - pw.y, '#ffe600');
                    powerupDisplay.classList.remove('hidden');
                    powerupBarContainer.classList.remove('hidden');
                    powerups.splice(i, 1);
                } else if (pw.x < -100) {
                    powerups.splice(i, 1);
                }
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.x -= gameSpeed;

                let oBox = obs.type === 'spike' 
                    ? { x: obs.x + 7, y: groundY - obs.h + 6, w: obs.w - 14, h: obs.h - 6 }
                    : { x: obs.x, y: groundY - obs.y, w: obs.w, h: obs.h };

                if (
                    pBox.x < oBox.x + oBox.w &&
                    pBox.x + pBox.w > oBox.x &&
                    pBox.y < oBox.y + oBox.h &&
                    pBox.y + pBox.h > oBox.y
                ) {
                    if (isPowerActive) {
                        audio.playDestroy();
                        screenShake = 10;
                        spawnParticles(obs.x + obs.w / 2, groundY - (obs.h || obs.y) / 2, obs.color || '#ff0055', 25);
                        createShockwave(obs.x + obs.w / 2, groundY - (obs.h || obs.y) / 2, '#ffaa00');
                        obstacles.splice(i, 1);
                    } else if (obs.type === 'block' && player.vy > 0 && pBox.y + pBox.h - player.vy <= oBox.y + 14) {
                        player.y = oBox.y - player.size;
                        player.vy = 0;
                        player.isGrounded = true;
                    } else {
                        triggerGameOver();
                    }
                }

                if (obs && obs.x + obs.w < -100) {
                    obstacles.splice(i, 1);
                }
            }

            score += Math.floor(gameSpeed / 2);
            scoreDisplay.innerText = `DIST: ${score}m`;
            let progressPct = Math.min(100, Math.floor((score / maxDistance) * 100));
            progressBar.style.width = `${progressPct}%`;

            if (screenShake > 0) screenShake *= 0.88;

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= p.decay;
                if (p.alpha <= 0) particles.splice(i, 1);
            }

            for (let i = shockwaves.length - 1; i >= 0; i--) {
                let sw = shockwaves[i];
                sw.radius += 2.5;
                sw.alpha -= 0.05;
                if (sw.alpha <= 0) shockwaves.splice(i, 1);
            }

            beatPulse = Math.sin(Date.now() / 140) * 0.15 + 0.85;
        }

        function triggerVictory() {
            currentState = GAME_STATE.VICTORY;
            audio.stopBGM();
            audio.playVictory();
            
            for (let i = 0; i < 5; i++) {
                setTimeout(() => {
                    spawnParticles(
                        Math.random() * canvas.width, 
                        Math.random() * (canvas.height / 2), 
                        ['#00f3ff', '#ff007f', '#00ff66', '#ffe600'][Math.floor(Math.random() * 4)], 
                        50
                    );
                }, i * 150);
            }

            score = maxDistance;
            scoreDisplay.innerText = `DIST: ${maxDistance}m`;
            progressBar.style.width = '100%';

            if (score > bestScore) {
                bestScore = score;
                localStorage.setItem('neon_dash_best', bestScore);
                bestDisplay.innerText = `BEST: ${bestScore}m`;
            }

            mainTitle.innerText = "FASE CONCLUÍDA! 🏆";
            mainTitle.className = "text-4xl sm:text-6xl md:text-7xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 via-green-400 to-cyan-400 glow-text mb-3";
            subMessage.innerHTML = `Parabéns! Você alcançou <span class="text-yellow-300 font-bold">100% (${maxDistance}m)</span> e venceu a fase!`;
            
            continueBtn.classList.add('hidden');
            startBtn.innerText = "JOGAR NOVAMENTE";
            centerMessage.style.display = 'flex';
            setTimeout(() => { centerMessage.style.opacity = '1'; }, 10);
        }

        function triggerGameOver() {
            currentState = GAME_STATE.GAMEOVER;
            audio.stopBGM();
            audio.playDeath();
            screenShake = 18;
            spawnParticles(player.x + player.size / 2, player.y + player.size / 2, '#ff0055', 40);
            attempts++;

            if (score > bestScore) {
                bestScore = score;
                localStorage.setItem('neon_dash_best', bestScore);
                bestDisplay.innerText = `BEST: ${bestScore}m`;
            }
            attemptsDisplay.innerText = `TRIES: ${attempts}`;

            mainTitle.innerText = "NEON DASH ULTRA";
            mainTitle.className = "text-4xl sm:text-6xl md:text-8xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-pink-500 to-yellow-400 glow-text mb-3";
            subMessage.innerHTML = `Game Over! Distância: <span class="text-cyan-400 font-bold">${score}m</span> (${Math.min(100, Math.floor((score / maxDistance) * 100))}%)`;
            startBtn.innerText = "NOVO JOGO (DO ZERO)";
            continueBtn.classList.remove('hidden');
            centerMessage.style.display = 'flex';
            setTimeout(() => { centerMessage.style.opacity = '1'; }, 10);
        }

        function draw() {
            ctx.save();

            if (screenShake > 0.5) {
                let rx = (Math.random() - 0.5) * screenShake;
                let ry = (Math.random() - 0.5) * screenShake;
                ctx.translate(rx, ry);
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#ffffff';
            backgroundStars.forEach(star => {
                ctx.globalAlpha = star.alpha;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
                if (currentState === GAME_STATE.PLAYING) {
                    star.x -= gameSpeed * 0.25 * star.speed;
                    if (star.x < 0) star.x = canvas.width;
                }
            });
            ctx.globalAlpha = 1.0;

            ctx.strokeStyle = `rgba(0, 243, 255, ${0.07 * beatPulse})`;
            ctx.lineWidth = 1;
            let gridSize = 70;
            let gridOffset = (score * 0.6) % gridSize;
            for (let x = -gridOffset; x < canvas.width; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }

            groundY = canvas.height - 100;
            ctx.shadowBlur = 25;
            ctx.shadowColor = '#00f3ff';
            ctx.strokeStyle = '#00f3ff';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(0, groundY);
            ctx.lineTo(canvas.width, groundY);
            ctx.stroke();

            let groundGrad = ctx.createLinearGradient(0, groundY, 0, canvas.height);
            groundGrad.addColorStop(0, 'rgba(0, 243, 255, 0.25)');
            groundGrad.addColorStop(1, 'rgba(3, 3, 8, 0.98)');
            ctx.fillStyle = groundGrad;
            ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);
            ctx.shadowBlur = 0;

            if (finishLineX > -50 && finishLineX < canvas.width + 100) {
                ctx.save();
                ctx.shadowBlur = 30;
                ctx.shadowColor = '#00ff66';
                ctx.strokeStyle = '#00ff66';
                ctx.lineWidth = 6;
                ctx.beginPath();
                ctx.moveTo(finishLineX, 0);
                ctx.lineTo(finishLineX, groundY);
                ctx.stroke();

                ctx.fillStyle = `rgba(0, 255, 102, ${0.25 + Math.sin(Date.now() / 100) * 0.15})`;
                ctx.fillRect(finishLineX - 25, 0, 50, groundY);

                ctx.fillStyle = '#ffffff';
                ctx.font = '900 24px Orbitron, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('FINISH (100%)', finishLineX, groundY / 2);
                ctx.restore();
            }

            shockwaves.forEach(sw => {
                ctx.save();
                ctx.globalAlpha = sw.alpha;
                ctx.strokeStyle = sw.color;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(sw.x, sw.y, sw.radius, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();
            });

            powerups.forEach(pw => {
                ctx.save();
                let py = groundY - pw.y;
                let floatY = Math.sin(pw.pulse) * 6;
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#ffe600';
                ctx.fillStyle = '#ffe600';
                ctx.beginPath();
                ctx.arc(pw.x, py + floatY, pw.size / 2, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(pw.x, py + floatY, pw.size / 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            obstacles.forEach(obs => {
                ctx.save();
                if (obs.type === 'spike') {
                    ctx.shadowBlur = 18;
                    ctx.shadowColor = obs.color;
                    ctx.fillStyle = obs.color;
                    ctx.beginPath();
                    ctx.moveTo(obs.x, groundY);
                    ctx.lineTo(obs.x + obs.w / 2, groundY - obs.h);
                    ctx.lineTo(obs.x + obs.w, groundY);
                    ctx.closePath();
                    ctx.fill();

                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.moveTo(obs.x + obs.w * 0.35, groundY);
                    ctx.lineTo(obs.x + obs.w / 2, groundY - obs.h * 0.65);
                    ctx.lineTo(obs.x + obs.w * 0.65, groundY);
                    ctx.closePath();
                    ctx.fill();
                } else if (obs.type === 'block') {
                    ctx.shadowBlur = 22;
                    ctx.shadowColor = '#8b00ff';
                    ctx.fillStyle = '#100020';
                    ctx.fillRect(obs.x, groundY - obs.y, obs.w, obs.h);

                    ctx.strokeStyle = '#8b00ff';
                    ctx.lineWidth = 3;
                    ctx.strokeRect(obs.x, groundY - obs.y, obs.w, obs.h);

                    ctx.strokeStyle = 'rgba(0, 243, 255, 0.6)';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(obs.x + 8, groundY - obs.y + 8, obs.w - 16, obs.h - 16);
                }
                ctx.restore();
            });

            player.trail.forEach(t => {
                ctx.save();
                ctx.globalAlpha = t.alpha;
                ctx.translate(t.x + t.size / 2, t.y + t.size / 2);
                ctx.rotate((t.rotation * Math.PI) / 180);
                ctx.fillStyle = player.color;
                ctx.fillRect(-t.size / 2, -t.size / 2, t.size, t.size);
                ctx.restore();
            });

            if (currentState === GAME_STATE.PLAYING || currentState === GAME_STATE.GAMEOVER) {
                ctx.save();
                ctx.shadowBlur = isPowerActive ? 35 : 28;
                ctx.shadowColor = isPowerActive ? '#ffe600' : player.color;
                ctx.translate(player.x + player.size / 2, player.y + player.size / 2);
                ctx.rotate((player.rotation * Math.PI) / 180);

                if (isPowerActive) {
                    ctx.strokeStyle = '#ffe600';
                    ctx.lineWidth = 4;
                    ctx.beginPath();
                    ctx.arc(0, 0, player.size * 0.85 + Math.sin(Date.now() / 80) * 3, 0, Math.PI * 2);
                    ctx.stroke();
                }

                ctx.fillStyle = isPowerActive ? '#ffe600' : player.color;
                ctx.fillRect(-player.size / 2, -player.size / 2, player.size, player.size);

                ctx.fillStyle = '#030308';
                ctx.fillRect(-player.size / 4, -player.size / 4, player.size / 2, player.size / 2);

                ctx.fillStyle = '#ffffff';
                ctx.fillRect(-player.size / 8, -player.size / 8, player.size / 4, player.size / 4);

                ctx.restore();
            }

            particles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            ctx.restore();
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        requestAnimationFrame(gameLoop);
    </script>
</body>
